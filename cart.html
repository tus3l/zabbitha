<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - زبّطها</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --dark-bg: #121212;
            --card-bg: #1E1E1E;
            --glass-bg: rgba(30, 30, 30, 0.85);
            --neon-blue: #4F9CF9;
            --neon-purple: #A78BFA;
            --neon-green: #34D399;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: #2A2A2A;
            --danger-red: #EF4444;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Demo Page Styling */
        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .demo-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .demo-subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        /* Cart Button */
        .cart-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(79, 156, 249, 0.3);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(79, 156, 249, 0.5);
        }

        .cart-badge {
            background: white;
            color: var(--neon-blue);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
        }

        /* Backdrop Overlay */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Shopping Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 450px;
            background: var(--card-bg);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        /* Cart Header */
        .cart-header {
            padding: 30px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(79, 156, 249, 0.1), rgba(167, 139, 250, 0.1));
        }

        .cart-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon {
            font-size: 1.5rem;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        /* Cart Body (Scrollable Items) */
        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-body::-webkit-scrollbar {
            width: 8px;
        }

        .cart-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .cart-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .cart-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Empty Cart State */
        .empty-cart {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-cart-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-cart p {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        /* Cart Item Card */
        .cart-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item:hover {
            border-color: rgba(79, 156, 249, 0.3);
            transform: translateX(5px);
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--hover-bg);
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--neon-blue);
        }

        /* Quantity Controls */
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
        }

        .qty-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            background: rgba(79, 156, 249, 0.2);
            border-color: var(--neon-blue);
        }

        .qty-btn:active {
            transform: scale(0.95);
        }

        .qty-number {
            min-width: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Remove Button */
        .remove-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger-red);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.1);
        }

        /* Cart Footer (Checkout Summary) */
        .cart-footer {
            padding: 25px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-primary);
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .summary-value {
            font-weight: 700;
            color: var(--text-primary);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            padding: 18px;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(79, 156, 249, 0.4);
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79, 156, 249, 0.6);
        }

        .checkout-btn:active {
            transform: translateY(0);
        }

        /* Promo Code Section */
        .promo-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .promo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .promo-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            text-align: right;
            direction: rtl;
            transition: all 0.3s ease;
        }

        .promo-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(79, 156, 249, 0.3);
        }

        .promo-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .promo-apply-btn {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
        }

        .promo-apply-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(79, 156, 249, 0.4);
        }

        .promo-apply-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .promo-message {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .promo-message.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .promo-message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
        }

        .remove-promo-btn {
            background: transparent;
            border: none;
            color: var(--neon-green);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
            transition: all 0.2s ease;
        }

        .remove-promo-btn:hover {
            color: var(--neon-red);
            transform: scale(1.2);
        }

        /* Demo Product Grid */
        .demo-products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        .demo-product {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .demo-product:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 12px 32px rgba(79, 156, 249, 0.3);
        }

        .demo-product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            background: var(--hover-bg);
        }

        .demo-product-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .demo-product-price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-blue);
            margin-bottom: 20px;
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, var(--neon-green), #10B981);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(52, 211, 153, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .cart-drawer {
                width: 100%;
                max-width: 380px;
            }

            .cart-btn {
                top: 15px;
                left: 15px;
                padding: 12px 20px;
                font-size: 1rem;
            }

            .demo-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Cart Button (Fixed) -->
    <button class="cart-btn" onclick="toggleCart()">
        🛒 السلة
        <span class="cart-badge" id="cartBadge">0</span>
    </button>

    <!-- Demo Page Content -->
    <div class="demo-container">
        <h1 class="demo-title">متجر زبّطها</h1>
        <p class="demo-subtitle">تسوق منتجاتنا الحصرية - جرب إضافة المنتجات للسلة ↓</p>

        <div class="demo-products">
            <div class="demo-product">
                <img src="https://via.placeholder.com/300x200/1E1E1E/4F9CF9?text=LED+Strip" alt="LED Strip" class="demo-product-img">
                <h3 class="demo-product-title">إضاءة LED للسيارات</h3>
                <p class="demo-product-price">299 ر.س</p>
                <button class="add-to-cart-btn" onclick="addToCart(1, 'إضاءة LED للسيارات', 299, 'https://via.placeholder.com/80/1E1E1E/4F9CF9?text=LED', 1.5)">
                    إضافة للسلة
                </button>
            </div>

            <div class="demo-product">
                <img src="https://via.placeholder.com/300x200/1E1E1E/A78BFA?text=Setup+Neon" alt="Setup Neon" class="demo-product-img">
                <h3 class="demo-product-title">لافتة نيون للسيتب</h3>
                <p class="demo-product-price">449 ر.س</p>
                <button class="add-to-cart-btn" onclick="addToCart(2, 'لافتة نيون للسيتب', 449, 'https://via.placeholder.com/80/1E1E1E/A78BFA?text=Neon', 0.8)">
                    إضافة للسلة
                </button>
            </div>

            <div class="demo-product">
                <img src="https://via.placeholder.com/300x200/1E1E1E/34D399?text=RGB+Lights" alt="RGB Lights" class="demo-product-img">
                <h3 class="demo-product-title">إضاءة RGB ذكية</h3>
                <p class="demo-product-price">199 ر.س</p>
                <button class="add-to-cart-btn" onclick="addToCart(3, 'إضاءة RGB ذكية', 199, 'https://via.placeholder.com/80/1E1E1E/34D399?text=RGB', 0.6)">
                    إضافة للسلة
                </button>
            </div>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

    <!-- Shopping Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <!-- Header -->
        <div class="cart-header">
            <h2 class="cart-title">
                <span class="cart-icon">🛒</span>
                سلة المشتريات
            </h2>
            <button class="close-btn" onclick="toggleCart()">✕</button>
        </div>

        <!-- Body (Cart Items) -->
        <div class="cart-body" id="cartBody">
            <!-- Cart items will be rendered here by JavaScript -->
        </div>

        <!-- Footer (Checkout Summary) -->
        <div class="cart-footer" id="cartFooter">
            <div class="summary-row">
                <span>المجموع الفرعي:</span>
                <span class="summary-value" id="subtotal">0 ر.س</span>
            </div>
            <div class="summary-row">
                <span>الوزن الإجمالي:</span>
                <span class="summary-value" id="totalWeight" style="color: var(--neon-purple);">0 كجم</span>
            </div>

            <!-- Promo Code Section -->
            <div class="promo-section">
                <div class="promo-input-group">
                    <input type="text" id="promoCodeInput" placeholder="كود الخصم" class="promo-input" maxlength="20">
                    <button onclick="applyPromoCode()" class="promo-apply-btn" id="promoApplyBtn">تطبيق</button>
                </div>
                <div id="promoSuccess" class="promo-message success" style="display:none;">
                    <span>✅ تم تطبيق خصم <span id="discountPercent"></span>%</span>
                    <button onclick="removePromoCode()" class="remove-promo-btn">✕</button>
                </div>
                <div id="promoError" class="promo-message error" style="display:none;"></div>
            </div>

            <!-- Discount Row (shown when promo applied) -->
            <div class="summary-row" id="discountRow" style="display:none;">
                <span>الخصم (<span id="discountLabel"></span>):</span>
                <span class="summary-value" style="color: var(--neon-green);" id="discountAmount">-0 ر.س</span>
            </div>

            <div class="summary-row">
                <span>الشحن:</span>
                <span class="summary-value">50 ر.س</span>
            </div>
            <div class="summary-row total">
                <span>الإجمالي:</span>
                <span class="summary-value" id="total">0 ر.س</span>
            </div>
            <button class="checkout-btn" onclick="proceedToCheckout()">
                إتمام الطلب
            </button>
        </div>
    </div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        let cart = [];

        // Load cart from LocalStorage on page load
        function loadCart() {
            const savedCart = localStorage.getItem('zabbitha_cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            updateCartUI();
        }

        // Save cart to LocalStorage
        function saveCart() {
            localStorage.setItem('zabbitha_cart', JSON.stringify(cart));
            
            // Set timestamp for cart expiry (1 hour)
            if (cart.length > 0 && !localStorage.getItem('zabbitha_cart_timestamp')) {
                localStorage.setItem('zabbitha_cart_timestamp', Date.now().toString());
            }
            
            // Clear timestamp if cart is empty
            if (cart.length === 0) {
                localStorage.removeItem('zabbitha_cart_timestamp');
            }
        }

        // ==================== CART OPERATIONS ====================

        // Toggle Cart Drawer
        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Add item to cart
        function addToCart(id, title, price, image, weight = 1.0) {
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: id,
                    title: title,
                    price: price,
                    image: image,
                    weight: weight,
                    quantity: 1
                });
            }
            
            saveCart();
            updateCartUI();
            
            // Show notification (optional)
            showNotification('تمت الإضافة للسلة ✓');
        }

        // Update item quantity
        function updateQuantity(id, action) {
            const item = cart.find(item => item.id === id);
            
            if (!item) return;
            
            if (action === 'increase') {
                item.quantity += 1;
            } else if (action === 'decrease') {
                item.quantity -= 1;
                
                if (item.quantity <= 0) {
                    removeItem(id);
                    return;
                }
            }
            
            saveCart();
            updateCartUI();
        }

        // Remove item from cart
        function removeItem(id) {
            if (confirm('هل تريد إزالة هذا المنتج من السلة؟')) {
                cart = cart.filter(item => item.id !== id);
                saveCart();
                updateCartUI();
                showNotification('تم الحذف من السلة');
            }
        }

        // Clear entire cart
        function clearCart() {
            if (confirm('هل تريد تفريغ السلة بالكامل؟')) {
                cart = [];
                saveCart();
                updateCartUI();
            }
        }

        // ==================== UI UPDATES ====================

        // Update cart UI (render items + totals)
        function updateCartUI() {
            const cartBody = document.getElementById('cartBody');
            const cartBadge = document.getElementById('cartBadge');
            
            // Update badge count
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartBadge.textContent = totalItems;
            
            // Render cart items
            if (cart.length === 0) {
                cartBody.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <p>السلة فارغة</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">ابدأ بإضافة منتجات من المتجر</p>
                    </div>
                `;
            } else {
                cartBody.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.title}" class="item-image">
                        <div class="item-details">
                            <div class="item-title">${item.title}</div>
                            <div class="item-price">${item.price} ر.س</div>
                            <div class="quantity-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 'decrease')">−</button>
                                <span class="qty-number">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 'increase')">+</button>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">🗑️</button>
                    </div>
                `).join('');
            }
            
            // Update totals
            updateTotals();
        }

        // Calculate and update totals
        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalWeight = calculateTotalWeight();
            const shipping = cart.length > 0 ? 50 : 0;
            
            // Check for applied promo code
            const appliedPromo = JSON.parse(localStorage.getItem('appliedPromo') || 'null');
            let discount = 0;
            
            if (appliedPromo && appliedPromo.discountPercentage) {
                discount = (subtotal * appliedPromo.discountPercentage) / 100;
                
                // Show discount row and success message
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountLabel').textContent = `${appliedPromo.discountPercentage}%`;
                document.getElementById('discountAmount').textContent = `-${discount.toFixed(2)} ر.س`;
                document.getElementById('promoSuccess').style.display = 'flex';
                document.getElementById('discountPercent').textContent = appliedPromo.discountPercentage;
                document.getElementById('promoCodeInput').value = appliedPromo.code;
                document.getElementById('promoCodeInput').disabled = true;
                document.getElementById('promoApplyBtn').disabled = true;
            } else {
                // Hide discount row
                document.getElementById('discountRow').style.display = 'none';
                document.getElementById('promoSuccess').style.display = 'none';
                document.getElementById('promoCodeInput').disabled = false;
                document.getElementById('promoApplyBtn').disabled = false;
            }
            
            const total = subtotal - discount + shipping;
            
            document.getElementById('subtotal').textContent = `${subtotal.toFixed(2)} ر.س`;
            document.getElementById('totalWeight').textContent = `${totalWeight.toFixed(2)} كجم`;
            document.getElementById('total').textContent = `${total.toFixed(2)} ر.س`;
        }

        // Calculate total cart weight
        function calculateTotalWeight() {
            return cart.reduce((sum, item) => {
                const itemWeight = item.weight || 1.0; // Default to 1 kg if not set
                return sum + (itemWeight * item.quantity);
            }, 0);
        }

        // ==================== PROMO CODE ====================

        // Apply promo code
        async function applyPromoCode() {
            const promoInput = document.getElementById('promoCodeInput');
            const promoError = document.getElementById('promoError');
            const applyBtn = document.getElementById('promoApplyBtn');
            
            const code = promoInput.value.trim().toUpperCase();
            
            if (!code) {
                promoError.textContent = '❌ الرجاء إدخال كود الخصم';
                promoError.style.display = 'block';
                setTimeout(() => promoError.style.display = 'none', 3000);
                return;
            }
            
            // Disable button during request
            applyBtn.disabled = true;
            applyBtn.textContent = 'جاري التحقق...';
            promoError.style.display = 'none';
            
            try {
                const response = await fetch('http://localhost:3000/api/promo/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Save promo to localStorage
                    localStorage.setItem('appliedPromo', JSON.stringify({
                        code: result.data.code,
                        discountPercentage: result.data.discountPercentage,
                        promoId: result.data.id
                    }));
                    
                    // Update UI
                    updateTotals();
                    showNotification('✅ تم تطبيق كود الخصم بنجاح!');
                } else {
                    promoError.textContent = `❌ ${result.message}`;
                    promoError.style.display = 'block';
                    setTimeout(() => promoError.style.display = 'none', 4000);
                }
            } catch (error) {
                console.error('Error applying promo code:', error);
                promoError.textContent = '❌ حدث خطأ أثناء التحقق من الكود';
                promoError.style.display = 'block';
                setTimeout(() => promoError.style.display = 'none', 4000);
            } finally {
                applyBtn.disabled = false;
                applyBtn.textContent = 'تطبيق';
            }
        }

        // Remove promo code
        function removePromoCode() {
            localStorage.removeItem('appliedPromo');
            document.getElementById('promoCodeInput').value = '';
            updateTotals();
            showNotification('تم إزالة كود الخصم');
        }

        // ==================== CHECKOUT ====================

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert('السلة فارغة! أضف منتجات أولاً.');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 50;
            
            alert(`إجمالي الطلب: ${total} ر.س\n\nشكراً لك! سيتم تحويلك لصفحة الدفع...`);
            
            // Here you would redirect to checkout page
            // window.location.href = '/checkout.html';
        }

        // ==================== NOTIFICATIONS ====================

        function showNotification(message) {
            // Simple notification (you can enhance this with a toast library)
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #34D399, #10B981);
                color: white;
                padding: 15px 30px;
                border-radius: 10px;
                font-weight: 700;
                font-size: 1rem;
                box-shadow: 0 8px 24px rgba(52, 211, 153, 0.4);
                z-index: 10000;
                animation: slideDown 0.3s ease;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideUp 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // ==================== INITIALIZATION ====================

        // Load cart when page loads
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>

    <style>
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }
    </style>
</body>
</html>
